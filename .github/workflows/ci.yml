name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            contracts:
              - 'stellar-contracts/**'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test -- --run

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kaystcx_user
          POSTGRES_PASSWORD: kaystcx_password
          POSTGRES_DB: kaystcx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaystcx_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: kaystcx_user
      DB_PASSWORD: kaystcx_password
      DB_NAME: kaystcx_test
      DATABASE_URL: postgres://kaystcx_user:kaystcx_password@localhost:5432/kaystcx_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret
      JWT_ACCESS_SECRET: test-jwt-access-secret
      JWT_REFRESH_SECRET: test-jwt-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck backend
        run: npm run typecheck
      - name: Build backend
        run: npm run build
      - name: Test backend
        run: npm test

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-contracts
      - name: Build contracts
        run: cargo build
      - name: Test contracts
        run: cargo test
      - name: Enforce storage architecture (no top-level storage modules)
        run: |
          if [ -n "$(find src -maxdepth 1 \( -name 'storage*.rs' -o -name 'storage' \))" ]; then
            echo 'Top-level storage modules are forbidden; add keys to the owning'
            echo "module's DataKey enum instead (see docs/ARCHITECTURE.md)."
            exit 1
          fi
