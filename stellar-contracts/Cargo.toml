# Note: the `src/request_status/` subcrate was removed (issue #58) because it was
# unreachable dead code — it was not listed as a workspace member and its
# `Request`/`RequestStatus` logic duplicated the contract's request handling.

[package]
name = "certificate-revocation"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
